name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: test

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx vue-tsc --noEmit

      - name: Unit test frontend
        run: npm run test:run

      - name: Prepare vendored libVLC
        shell: pwsh
        run: .\scripts\ci-prepare-vlc.ps1

      - name: Cargo test (workspace)
        working-directory: src-tauri
        run: cargo test --workspace --features vlc

  build:
    name: Build (Windows)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: build

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare vendored libVLC
        shell: pwsh
        run: .\scripts\ci-prepare-vlc.ps1

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (Windows release)
        run: npm run tauri:build

      - name: Bundle portable Windows package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse src-tauri\target\release\Orpheon.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "Orpheon.exe not found" }
          .\scripts\bundle-libvlc.ps1 -OutDir dist\win -ExeSource $exe
          Get-ChildItem dist\win | Format-Table Name, Length

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orpheon-windows
          path: |
            dist/win/**
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $v = [string]$pkg.version
          if (-not $v) { throw "package.json version is empty" }
          $tag = "v$v"
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: orpheon-windows
          path: artifact

      - name: Package release assets
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          New-Item -ItemType Directory -Force -Path dist\release | Out-Null

          $portableSrc = if (Test-Path "artifact\dist\win") {
            "artifact\dist\win"
          } else {
            $exe = Get-ChildItem -Recurse artifact -Filter Orpheon.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $exe) { throw "Portable Orpheon.exe not found in artifact" }
            $exe.Directory.FullName
          }

          $zip = "dist\release\Orpheon-$tag-windows-x64-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$portableSrc\*" -DestinationPath $zip -Force
          Write-Host "Created $zip"

          foreach ($pattern in @(
            "artifact\src-tauri\target\release\bundle\msi\*.msi",
            "artifact\src-tauri\target\release\bundle\nsis\*.exe"
          )) {
            Get-ChildItem $pattern -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName dist\release\ -Force
            }
          }

          Get-ChildItem dist\release | Format-Table Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Orpheon ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
