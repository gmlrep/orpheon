name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - "COPYING*"
      - ".gitignore"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - "COPYING*"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      run_build:
        description: Force Windows Tauri build + artifacts
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/reusable-ci.yml
    with:
      # Full Tauri build on master/main pushes, manual dispatch, or PRs labeled "build".
      run_build: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_build) || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && contains(join(github.event.pull_request.labels.*.name, ','), 'build')) }}
      rust_cache_key: ci
    secrets:
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
