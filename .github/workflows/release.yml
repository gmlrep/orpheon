# Single release path: publish GitHub Release assets from version tags (v*).
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality + build
    uses: ./.github/workflows/reusable-ci.yml
    with:
      run_build: true
      rust_cache_key: release
    secrets:
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

  publish:
    name: GitHub Release
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orpheon-windows
          path: artifact

      - name: Package release assets
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist\release | Out-Null

          $portableSrc = if (Test-Path "artifact\dist\win") {
            "artifact\dist\win"
          } else {
            $exe = Get-ChildItem -Recurse artifact -Filter Orpheon.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $exe) { throw "Portable Orpheon.exe not found in artifact" }
            $exe.Directory.FullName
          }

          foreach ($f in @("COPYING.txt", "AUTHORS.txt", "THANKS.txt")) {
            $src = Join-Path "vendor\vlc" $f
            if (Test-Path $src) { Copy-Item $src $portableSrc -Force }
          }

          $zip = "dist\release\Orpheon-$tag-windows-x64-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$portableSrc\*" -DestinationPath $zip -Force
          Write-Host "Created $zip"

          $installerCount = 0
          foreach ($pattern in @(
            "artifact\src-tauri\target\release\bundle\msi\*.msi",
            "artifact\src-tauri\target\release\bundle\nsis\*.exe"
          )) {
            Get-ChildItem $pattern -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName dist\release\ -Force
              $installerCount++
            }
          }
          if ($installerCount -lt 1) {
            throw "Expected at least one MSI/NSIS installer in build artifacts"
          }

          .\scripts\checksums.ps1 -Dir dist\release
          Get-ChildItem dist\release | Format-Table Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: dist/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
