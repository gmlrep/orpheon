name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Release (Windows)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx vue-tsc --noEmit

      - name: Unit test frontend
        run: npm run test:run

      - name: Prepare vendored libVLC
        shell: pwsh
        run: .\scripts\ci-prepare-vlc.ps1

      - name: Cargo test (workspace)
        working-directory: src-tauri
        run: cargo test --workspace --features vlc

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (Windows release)
        run: npm run tauri:build

      - name: Bundle portable zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem -Recurse src-tauri\target\release\Orpheon.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "Orpheon.exe not found" }

          $out = "dist\win"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          .\scripts\bundle-libvlc.ps1 -OutDir $out -ExeSource $exe

          # Copy license texts next to the portable build when present.
          foreach ($f in @("COPYING.txt", "AUTHORS.txt", "THANKS.txt")) {
            $src = Join-Path "vendor\vlc" $f
            if (Test-Path $src) { Copy-Item $src $out -Force }
          }

          New-Item -ItemType Directory -Force -Path dist\release | Out-Null
          $zip = "dist\release\Orpheon-$tag-windows-x64-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$out\*" -DestinationPath $zip -Force
          Write-Host "Created $zip"

          # Collect Tauri installers if the bundler produced them.
          $msi = Get-ChildItem src-tauri\target\release\bundle\msi\*.msi -ErrorAction SilentlyContinue
          $nsis = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe -ErrorAction SilentlyContinue
          foreach ($f in @($msi + $nsis)) {
            if ($f) {
              Copy-Item $f.FullName dist\release\ -Force
            }
          }
          Get-ChildItem dist\release | Format-Table Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
