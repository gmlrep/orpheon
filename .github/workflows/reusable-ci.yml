# Shared quality gates + optional Windows Tauri build for CI and Release.
name: Reusable CI

on:
  workflow_call:
    inputs:
      run_build:
        description: Run frontend + Tauri release build and upload artifacts
        type: boolean
        default: false
      rust_cache_key:
        description: Shared rust-cache key across jobs in this workflow run family
        type: string
        default: ci
    secrets:
      WINDOWS_CERT_PFX:
        required: false
      WINDOWS_CERT_PASSWORD:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: warn

  rust:
    name: Rust
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ inputs.rust_cache_key }}

      - name: Prepare vendored libVLC
        shell: pwsh
        run: .\scripts\ci-prepare-vlc.ps1

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --features vlc --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --workspace --features vlc

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  build:
    name: Build (Windows)
    needs: [frontend, rust, audit]
    if: inputs.run_build
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ inputs.rust_cache_key }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare vendored libVLC
        shell: pwsh
        run: .\scripts\ci-prepare-vlc.ps1

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (Windows release)
        run: npm run tauri:build

      - name: Verify installers include libVLC
        shell: pwsh
        run: |
          # Ignore target/release/libvlc.dll from build.rs — only check installer package trees.
          $bundleRoot = "src-tauri\target\release\bundle"
          if (-not (Test-Path $bundleRoot)) { throw "bundle output missing: $bundleRoot" }
          $refs = @()
          $refs += Get-ChildItem -Recurse $bundleRoot -Include *.nsi,*.wxs,*.wixproj,*.xml -ErrorAction SilentlyContinue |
            Select-String -Pattern "libvlc\.dll" -SimpleMatch:$false -ErrorAction SilentlyContinue
          $dlls = Get-ChildItem -Recurse $bundleRoot -Filter libvlc.dll -ErrorAction SilentlyContinue
          if (($refs.Count -eq 0) -and ($dlls.Count -eq 0)) {
            Write-Host "Bundle tree (first 100 paths):"
            Get-ChildItem -Recurse $bundleRoot -ErrorAction SilentlyContinue |
              Select-Object -First 100 -ExpandProperty FullName
            throw "Installer bundle has no libvlc.dll (and no NSIS/WiX reference) — VLC core would be missing after install"
          }
          if ($dlls.Count -gt 0) {
            Write-Host "libvlc.dll in bundle:"
            $dlls | ForEach-Object { $_.FullName }
          }
          if ($refs.Count -gt 0) {
            Write-Host "libvlc.dll referenced in installer sources:"
            $refs | Select-Object -First 20 | ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
          }

      - name: Bundle portable Windows package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse src-tauri\target\release\Orpheon.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "Orpheon.exe not found" }
          .\scripts\bundle-libvlc.ps1 -OutDir dist\win -ExeSource $exe
          if (-not (Test-Path dist\win\libvlc.dll)) { throw "portable package missing libvlc.dll" }
          if (-not (Test-Path dist\win\plugins)) { throw "portable package missing plugins/" }
          Get-ChildItem dist\win | Format-Table Name, Length

      - name: Optional Authenticode signing
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $targets = @()
          $targets += Get-ChildItem dist\win\Orpheon.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          $targets += Get-ChildItem src-tauri\target\release\bundle\msi\*.msi -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          $targets += Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          if ($targets.Count -eq 0) { throw "No binaries found to sign" }
          .\scripts\sign-windows.ps1 -Path $targets

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orpheon-windows
          path: |
            dist/win/**
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
