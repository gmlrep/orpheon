[package]
name = "orpheon"
version = "0.1.1"
description = "Orpheon — local media player powered by libVLC"
authors = ["Orpheon Contributors"]
edition = "2021"
license = "GPL-2.0-or-later"

[lib]
name = "orpheon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["vlc"]
# Link and use libVLC. Disable for UI-only builds.
vlc = ["libvlc/link", "dep:libvlc"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
directories = { workspace = true }
library = { path = "crates/library" }
settings = { path = "crates/settings" }
libvlc = { path = "crates/libvlc", default-features = false, optional = true }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[workspace]
resolver = "2"
members = [
  ".",
  "crates/libvlc-sys",
  "crates/libvlc",
  "crates/library",
  "crates/settings",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "GPL-2.0-or-later"
authors = ["Orpheon Contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
walkdir = "2"
log = "0.4"
env_logger = "0.11"
libc = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
wildcard_imports = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
