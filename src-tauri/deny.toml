# cargo-deny config — keep CI supply-chain checks focused and actionable.
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
  { triple = "x86_64-pc-windows-msvc" },
]
all-features = false
features = ["vlc"]

[advisories]
yanked = "warn"
# Ignore only with a tracked reason + expiry when needed.
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "GPL-2.0",
  "GPL-2.0-or-later",
  "GPL-3.0",
  "GPL-3.0-or-later",
  "LGPL-2.0",
  "LGPL-2.0-or-later",
  "LGPL-2.1",
  "LGPL-2.1-or-later",
  "LGPL-3.0",
  "LGPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
